name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/meeting_ai
          AUTH_SECRET: ci-build-placeholder-secret
        run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meeting_ai
          MYSQL_USER: transfer
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://transfer:ci_password@127.0.0.1:3306/meeting_ai
      # 注意：不注入 AUTH_SECRET —— 让 dev server 首次启动时自动生成 64 字节
      # 随机密钥并落盘 data/auth_secret，d-auth-deep 组需要读取该文件
      QA_TEST_MODE: "1"
      QA_BASE_URL: http://127.0.0.1:7200
      no_proxy: "127.0.0.1,localhost,::1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=mysql://transfer:ci_password@127.0.0.1:3306/meeting_ai
          QA_TEST_MODE=1
          QA_BASE_URL=http://127.0.0.1:7200
          EOF

      - name: Create database
        run: node scripts/db/create-mysql-database.mjs

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3306 -utransfer -pci_password --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            echo "waiting mysql ($i/30)"
            sleep 2
          done
          echo "MySQL timeout"
          exit 1

      - name: Debug environment
        run: |
          echo "node: $(node -v)"
          echo "pwd: $(pwd)"
          echo "next bin exists: $(test -f node_modules/next/dist/bin/next && echo yes || echo no)"
          echo "env.local exists: $(test -f .env.local && echo yes || echo no)"
          echo "env.local content:"
          cat .env.local
          echo "proxy env:"
          env | grep -i proxy || echo "(none)"
          echo "port 7200 before start:"
          (ss -ltnp 2>/dev/null | grep 7200 || echo "(free)")

      - name: Run integration tests
        run: node scripts/test/ci-integration.mjs

      - name: Show integration diagnostics
        if: always()
        run: |
          echo "::group::_ci_integration.log"
          cat scripts/_ci_integration.log 2>/dev/null || echo "(missing)"
          echo "::endgroup::"
          echo "::group::_ci_devserver.log"
          cat scripts/_ci_devserver.log 2>/dev/null || echo "(missing)"
          echo "::endgroup::"
          echo "::group::port 7200 after"
          (ss -ltnp 2>/dev/null | grep 7200 || echo "(not listening)")
          echo "::endgroup::"
          # 把关键错误行提升为注解，便于在 Actions 概览页直接看到
          if [ -f scripts/_ci_integration.log ]; then
            grep -E "error|Error|ECONNREFUSED|退出|failed" scripts/_ci_integration.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
          fi
          if [ -f scripts/_ci_devserver.log ]; then
            grep -E "error|Error|EADDRINUSE|Cannot find" scripts/_ci_devserver.log | head -10 | while read -r line; do
              echo "::error::dev: $line"
            done
          fi

      - name: Push debug log to ci-debug-log branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci-bot"
          git checkout --orphan ci-debug-log -q
          git rm -rf --cached . -q 2>/dev/null || true
          cp scripts/_ci_integration.log debug-integration.log 2>/dev/null || echo "missing" > debug-integration.log
          cp scripts/_ci_devserver.log debug-devserver.log 2>/dev/null || echo "missing" > debug-devserver.log
          git add -f debug-integration.log debug-devserver.log
          git commit -q -m "ci debug logs (run $GITHUB_RUN_ID)"
          git push -q -f origin ci-debug-log
          echo "logs pushed to ci-debug-log branch"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            scripts/_ci_devserver.log
            scripts/_ci_integration.log
          if-no-files-found: ignore
