name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/meeting_ai
          AUTH_SECRET: ci-build-placeholder-secret
        run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meeting_ai
          MYSQL_USER: transfer
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://transfer:ci_password@127.0.0.1:3306/meeting_ai
      AUTH_SECRET: ci-integration-secret-key
      QA_TEST_MODE: "1"
      QA_BASE_URL: http://127.0.0.1:7200
      no_proxy: "127.0.0.1,localhost,::1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=mysql://transfer:ci_password@127.0.0.1:3306/meeting_ai
          AUTH_SECRET=ci-integration-secret-key
          QA_TEST_MODE=1
          QA_BASE_URL=http://127.0.0.1:7200
          EOF

      - name: Create database
        run: node scripts/db/create-mysql-database.mjs

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3306 -utransfer -pci_password --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            echo "waiting mysql ($i/30)"
            sleep 2
          done
          echo "MySQL timeout"
          exit 1

      - name: Run integration tests
        run: node scripts/test/ci-integration.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            scripts/_ci_devserver.log
            scripts/_ci_integration.log
          if-no-files-found: ignore
